# Local profile: `docker compose up` on a laptop, no cloud accounts, plain HTTP on :8080.
# Every service here maps to a requirement; see the README's "Why each tool" table.

x-app: &app
  build:
    context: .
    target: runtime
    args:
      BUILD_SHA: ${BUILD_SHA:-dev}
  image: grs-app:local
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
    DATABASE_URL: ${API_DATABASE_URL}
  restart: unless-stopped
  stop_grace_period: 45s
  depends_on: &app-deps
    postgres:
      condition: service_healthy
    redis-broker:
      condition: service_started
    redis-cache:
      condition: service_started

x-web-healthcheck: &web-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 15s

# Where PostgreSQL ships its WAL archive and base backups (deploy/postgres/wal-g.sh). Locally a
# bucket on the storage container; production: AWS S3 through the instance role (empty
# endpoint and keys in .env).
x-offsite-env: &offsite-env
  OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-offsite}
  OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT-http://storage:8333}
  OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-us-east-1}
  OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY-grs-local}
  OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY-grs-local-secret}
  WAL_ARCHIVE: ${WAL_ARCHIVE:-on}

services:
  # Source of truth for everything. Settings: deploy/postgres/conf.d/grs.conf.
  postgres:
    build: ./deploy/postgres
    image: grs-postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Checksums detect silent disk corruption instead of serving corrupted rows.
      POSTGRES_INITDB_ARGS: --data-checksums
      GRS_OWNER_PASSWORD: ${GRS_OWNER_PASSWORD}
      GRS_API_PASSWORD: ${GRS_API_PASSWORD}
      GRS_WORKER_PASSWORD: ${GRS_WORKER_PASSWORD}
      GRS_REPLICATOR_PASSWORD: ${GRS_REPLICATOR_PASSWORD}
      GRS_DEV_CREATEDB: "1"  # local only: lets tests create their database as grs_owner
      <<: *offsite-env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/conf.d:/etc/postgresql/conf.d:ro
      - ./deploy/postgres:/grs:ro
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP: during first-start initialisation the server listens only on its socket, so a
      # socket check would report ready before the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U grs_owner -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 60s

  # Warm standby, streaming from the primary. Opt-in: docker compose --profile standby up -d
  # Read-only; promotion is a manual step (docs/runbook.md).
  postgres-standby:
    profiles: ["standby"]
    image: grs-postgres:17
    command: ["bash", "/grs/standby.sh"]
    environment:
      <<: *offsite-env  # used only if promoted: it then archives like the primary did
      PGDATA: /var/lib/postgresql/data
      GRS_REPLICATOR_PASSWORD: ${GRS_REPLICATOR_PASSWORD}
    volumes:
      - pgdata-standby:/var/lib/postgresql/data
      - ./deploy/postgres/conf.d:/etc/postgresql/conf.d:ro
      - ./deploy/postgres:/grs:ro
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

  # Task queue. noeviction: a full broker must refuse writes, never silently drop a task.
  # No persistence: the outbox in PostgreSQL is the durable copy.
  redis-broker:
    image: redis:8.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # Cache and rate-limit counters. allkeys-lru: under memory pressure, evict anything.
  redis-cache:
    image: redis:8.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  # Runs schema migrations once, before any app process starts.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: ${OWNER_DATABASE_URL}
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Creates the off-host bucket (versioned, Object Lock) if missing, or checks the existing one.
  # One-shot; it only warns if the store is unreachable, which must not stop the site.
  offsite-init:
    <<: *app
    command: ["python", "manage.py", "ensure_offsite_bucket"]
    restart: "no"
    depends_on:
      storage:
        condition: service_started

  api:
    <<: *app
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully
    healthcheck: *web-healthcheck

  # Password-hashing bulkhead: same image, own worker pool.
  api-auth:
    <<: *app
    command: ["gunicorn", "--config", "deploy/gunicorn/auth.py", "config.wsgi:application"]
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully
    healthcheck: *web-healthcheck

  worker:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: ${WORKER_DATABASE_URL}
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully
      offsite-init:  # it stores the audit anchors; offsite-init never fails the start
        condition: service_completed_successfully

  beat:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: ${WORKER_DATABASE_URL}
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully

  # Edge proxy for the API, and the web app's static files (built from web/).
  nginx:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_DEMO: ${DEMO_MODE:-false}
    image: grs-nginx:local
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/grs:/etc/nginx/grs:ro
      - edge-logs:/var/log/grs
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      api-auth:
        condition: service_healthy
    restart: unless-stopped

  # Watches the service level indicators (from Nginx's access log) and the dependencies every
  # minute; pushes alerts to NTFY_URL. Its own process, with no dependency on the broker or
  # workers, so it still reports when they are what broke.
  monitor:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: ${WORKER_DATABASE_URL}
    command: ["python", "manage.py", "monitor"]
    volumes:
      - edge-logs:/var/log/grs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # S3-compatible object storage for attachments, self-hosted so files stay in-country.
  storage:
    image: chrislusf/seaweedfs:4.47
    # No bucket appears on first upload: the off-host bucket must be created with Object Lock
    # (offsite-init), never implicitly without it.
    command: ["mini", "-dir=/data", "-s3.autoCreateBucket=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-grs-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-grs-local-secret}
      S3_BUCKET: ${S3_BUCKET:-attachments}
    volumes:
      - storage:/data
    ports:
      - "127.0.0.1:8333:8333"
    restart: unless-stopped

  # Malware scanner for attachments: clamd, with freshclam updating signatures every 2 hours.
  # About 1.5 GB of memory once its database is loaded, so locally it is opt-in:
  #   docker compose --profile full up -d   (and ATTACHMENT_SCANNER=apps.collab.scanning.ClamdScanner)
  # Without it the worker uses the EICAR stand-in. Production always runs it.
  clamav:
    profiles: ["full"]
    image: clamav/clamav:1.5.4
    volumes:
      - clamav-db:/var/lib/clamav
    mem_limit: 3g
    restart: unless-stopped

  # Catches outgoing email locally; web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  pgdata-standby:
  storage:
  clamav-db:
  edge-logs:
