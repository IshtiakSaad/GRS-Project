name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit, not a tag: a moved tag cannot change what runs here.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: grs
          POSTGRES_USER: grs
          POSTGRES_PASSWORD: grs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grs -d grs" --health-interval 5s --health-retries 10
      redis-broker:
        image: redis:8.6-alpine
        ports: ["6379:6379"]
      redis-cache:
        image: redis:8.6-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pytest --cov --cov-report=term-missing:skip-covered

  # Boots the real stack the way a reviewer would, then checks that Nginx serves the build
  # that was just made. The same check guards production deploys.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Serves this build through Nginx
        run: |
          body=$(curl -sf http://localhost:8080/health/ready)
          echo "$body"
          test "$(echo "$body" | jq -r .build)" = "${{ github.sha }}"
          test "$(echo "$body" | jq -r .database)" = "true"
      - name: Unknown routes answer with the JSON error envelope
        run: curl -s http://localhost:8080/nope | jq -e '.error.code == "NOT_FOUND"'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
