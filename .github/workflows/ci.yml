name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit, not a tag: a moved tag cannot change what runs here.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  # The web app against the real stack: one request through citizen, admin and officer, on a
  # phone-sized browser, plus every staff screen loading without an error.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Every resolution goes to the review queue, so the review screens have work to test.
      - run: cp .env.example .env && echo "REVIEW_SAMPLE_RATE=1" >> .env
      - run: docker compose up -d --build --wait --wait-timeout 240
      - name: Load demo data; keep the administrator's two-step secret for the tests
        run: |
          out=$(docker compose run --rm --no-deps api python manage.py seed_demo)
          secret=$(echo "$out" | grep -o 'secret=[A-Z2-7]*' | head -1 | cut -d= -f2)
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "E2E_ADMIN_TOTP_SECRET=$secret" >> "$GITHUB_ENV"
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color --tail 200 api worker nginx
      - if: always()
        run: docker compose down -v

  # Tests run against the same PostgreSQL image, roles and settings as every other environment
  # (pgaudit, per-role privileges and timeouts), so they are started through Compose.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait postgres redis-broker redis-cache storage
      - run: pip install --require-hashes -r requirements/dev.txt
      - name: Compile translations
        run: |
          command -v msgfmt || { sudo apt-get update && sudo apt-get install -y gettext; }
          find src/locale -name '*.po' -execdir msgfmt --check -o django.mo django.po \;
      - run: pytest --cov --cov-report=term-missing:skip-covered
        env:
          DATABASE_URL: postgres://grs_owner:owner-local@localhost:5432/grs
      - if: failure()
        run: docker compose logs --no-color postgres storage

  # The ClamAV client against the real ClamAV image with current signatures, as production runs
  # it: the test file must be found and a clean file must pass.
  clamav:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose --profile full up -d --wait --wait-timeout 480 clamav
      - run: docker build -q --target test -t grs-app:test .
      - run: >
          docker run --rm --network grs-project_default -e CLAMD_LIVE_HOST=clamav
          grs-app:test pytest -q -p no:cacheprovider --no-cov tests/unit/test_clamd.py
      - if: failure()
        run: docker compose logs --no-color --tail 100 clamav

  # Boots the real stack the way a reviewer would, then checks that Nginx serves the build
  # that was just made. The same check guards production deploys.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Serves this build through Nginx
        run: |
          body=$(curl -sf http://localhost:8080/health/ready)
          echo "$body"
          test "$(echo "$body" | jq -r .build)" = "${{ github.sha }}"
          test "$(echo "$body" | jq -r .database)" = "true"
      - name: Unknown API routes answer with the JSON error envelope
        run: curl -s http://localhost:8080/api/v1/nope | jq -e '.error.code == "NOT_FOUND"'
      - name: Serves the web app, with a 404 page for unknown pages
        run: |
          curl -sf http://localhost:8080/ | grep -q '<html'
          curl -sf http://localhost:8080/login/ | grep -q '<html'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope/)" = 404
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
