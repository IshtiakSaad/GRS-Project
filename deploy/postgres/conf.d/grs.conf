# Server settings for the primary and the standby. Sized for a laptop or the demo VM; a
# production host raises the memory values to its budget.

# --- Memory and connections ---
max_connections = 50            # fixed budget: every client is a known service
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Extensions ---
shared_preload_libraries = 'pg_stat_statements,pgaudit'

# --- Audit of direct database use ---
# Everyone: schema and role changes. Superusers and personal operator logins are set to 'all'
# per role (roles.sql). Only a superuser can change these, so a session cannot switch them off.
pgaudit.log = 'ddl, role'
pgaudit.log_catalog = off
pgaudit.log_parameter = off     # parameters carry citizens' personal data
pgaudit.log_relation = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h '

# --- Visibility ---
log_min_duration_statement = 250ms
log_lock_waits = on
deadlock_timeout = 1s
log_autovacuum_min_duration = 1s
log_temp_files = 0

# --- Durability and WAL ---
checkpoint_timeout = 15min
max_wal_size = 2GB
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
# A stopped standby must never fill the primary's disk with retained WAL.
max_slot_wal_keep_size = 4GB
wal_keep_size = 512MB
hot_standby = on

# --- Continuous archiving (point-in-time recovery) ---
# Every finished WAL segment goes to the off-host bucket (deploy/postgres/wal-archive.sh), and a
# segment is closed at least once a minute while anything is written: at most about a minute
# of committed data is at risk if the server is lost.
archive_mode = on
archive_command = 'bash /grs/wal-archive.sh %p'
archive_timeout = 60

# --- Dead clients ---
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
