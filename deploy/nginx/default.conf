# Edge proxy. It buffers slow clients so gunicorn workers are never held by a 3G upload,
# and routes password-hashing endpoints to the api-auth bulkhead.

# Keep the caller's X-Request-ID if present; otherwise start one here.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format json escape=json
    '{"ts":"$time_iso8601","request_id":"$req_id","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"urt":"$upstream_response_time","upstream":"$upstream_addr",'
    '"ip":"$remote_addr","ua":"$http_user_agent"}';

# Re-resolve container names every few seconds (Docker's DNS). A recreated container gets a
# new IP; without this, Nginx keeps the old one and answers 502 until restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

# Edge rate limits (design §12.1), per client IP and deliberately generous: behind carrier NAT
# thousands of citizens can share one address. The application limits per user and per phone.
limit_req_zone $binary_remote_addr zone=per_ip:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 16;
}

upstream api_auth {
    zone api_auth 64k;
    server api-auth:8000 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Attachments go straight to object storage via presigned URLs, never through here.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_buffering on;
    proxy_request_buffering on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;   # top of the ladder: statement 5 s < gunicorn 15 s < nginx 20 s
    proxy_send_timeout 20s;
    # Nginx sets the header itself so it is present even on 502/504 answered here.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $req_id always;

    # A limited request gets the API's own error envelope, not an HTML page.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Request-ID $req_id always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again shortly.","fields":{},"request_id":"$req_id"}}';
    }

    # Password-hashing routes: the bulkhead. A meta-test keeps this list and the code in step.
    location ~ ^/api/v1/(auth/(register|login|2fa/verify|2fa/recovery|2fa/confirm|password/reset/confirm|activate)|me/(password|phone)|admin/users/[^/]+/reset-password)$ {
        proxy_pass http://api_auth;
        limit_req zone=auth_ip burst=40 nodelay;
        limit_req zone=per_ip burst=200 nodelay;
    }

    # The other routes callable before login (codes, refresh): the same stricter zone.
    # A regex location, after the bulkhead one: first regex match wins, so hashing routes still
    # go to api-auth. (A ^~ prefix location here would silently take them.)
    location ~ ^/api/v1/auth/ {
        proxy_pass http://api;
        limit_req zone=auth_ip burst=40 nodelay;
        limit_req zone=per_ip burst=200 nodelay;
    }

    location / {
        proxy_pass http://api;
        limit_req zone=per_ip burst=200 nodelay;
    }
}
