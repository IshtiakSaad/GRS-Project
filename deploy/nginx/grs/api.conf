# The API behind one server block: limits, buffering, timeouts and the bulkhead routing.
# Included by default.conf (local) and prod.conf.template (production).

access_log /dev/stdout json;
# The same lines, for the monitor: it computes availability and latency from them.
access_log /var/log/grs/edge.json json;
error_log  /dev/stderr warn;

# Attachments go straight to object storage via presigned URLs, never through here.
client_max_body_size 1m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 20s;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $req_id;
proxy_buffering on;
proxy_request_buffering on;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;   # top of the ladder: statement 5 s < gunicorn 15 s < nginx 20 s
proxy_send_timeout 20s;
# Nginx sets the header itself so it is present even on 502/504 answered here.
proxy_hide_header X-Request-ID;
add_header X-Request-ID $req_id always;

# A limited request gets the API's own error envelope, not an HTML page.
error_page 429 = @rate_limited;
location @rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header X-Request-ID $req_id always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again shortly.","fields":{},"request_id":"$req_id"}}';
}

# Password-hashing routes: the bulkhead. A meta-test keeps this list and the code in step.
location ~ ^/api/v1/(auth/(register|login|2fa/verify|2fa/recovery|2fa/confirm|password/reset/confirm|activate)|me/(password|phone)|admin/users/[^/]+/reset-password)$ {
    proxy_pass http://api_auth;
    limit_req zone=auth_ip burst=40 nodelay;
    limit_req zone=per_ip burst=200 nodelay;
}

# The other routes callable before login (codes, refresh): the same stricter zone.
# A regex location, after the bulkhead one: first regex match wins, so hashing routes still
# go to api-auth. (A ^~ prefix location here would silently take them.)
location ~ ^/api/v1/auth/ {
    proxy_pass http://api;
    limit_req zone=auth_ip burst=40 nodelay;
    limit_req zone=per_ip burst=200 nodelay;
}

location ~ ^/(api|health)/ {
    proxy_pass http://api;
    limit_req zone=per_ip burst=200 nodelay;
}

# Everything else is the web app: static files built from web/ into the image. Each page is
# a folder with an index.html. Hashed assets never change; pages are revalidated each visit.
location /_next/static/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Request-ID $req_id always;
}

location / {
    root /usr/share/nginx/html;
    index index.html;
    # /login -> /login/ as a relative redirect, so it keeps whatever host and port the
    # browser used (localhost:8080 locally, where Nginx itself listens on 80).
    absolute_redirect off;
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
    # No request limit on the web app's own files: Nginx serves them from memory, and a page
    # load fetches many at once. Counting them here spent the API's per-address budget, so
    # one busy page could get a neighbour behind the same carrier address refused.
    add_header Cache-Control "no-cache" always;
    add_header X-Request-ID $req_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Next.js inlines small bootstrap scripts and styles, hence 'unsafe-inline'; nothing is
    # loaded from another origin except uploads, which go straight to object storage.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' $files_origin; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
