# The API behind one server block: limits, buffering, timeouts and the bulkhead routing.
# Included by default.conf (local) and prod.conf.template (production).

access_log /dev/stdout json;
error_log  /dev/stderr warn;

# Attachments go straight to object storage via presigned URLs, never through here.
client_max_body_size 1m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 20s;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $req_id;
proxy_buffering on;
proxy_request_buffering on;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;   # top of the ladder: statement 5 s < gunicorn 15 s < nginx 20 s
proxy_send_timeout 20s;
# Nginx sets the header itself so it is present even on 502/504 answered here.
proxy_hide_header X-Request-ID;
add_header X-Request-ID $req_id always;

# A limited request gets the API's own error envelope, not an HTML page.
error_page 429 = @rate_limited;
location @rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header X-Request-ID $req_id always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again shortly.","fields":{},"request_id":"$req_id"}}';
}

# Password-hashing routes: the bulkhead. A meta-test keeps this list and the code in step.
location ~ ^/api/v1/(auth/(register|login|2fa/verify|2fa/recovery|2fa/confirm|password/reset/confirm|activate)|me/(password|phone)|admin/users/[^/]+/reset-password)$ {
    proxy_pass http://api_auth;
    limit_req zone=auth_ip burst=40 nodelay;
    limit_req zone=per_ip burst=200 nodelay;
}

# The other routes callable before login (codes, refresh): the same stricter zone.
# A regex location, after the bulkhead one: first regex match wins, so hashing routes still
# go to api-auth. (A ^~ prefix location here would silently take them.)
location ~ ^/api/v1/auth/ {
    proxy_pass http://api;
    limit_req zone=auth_ip burst=40 nodelay;
    limit_req zone=per_ip burst=200 nodelay;
}

location / {
    proxy_pass http://api;
    limit_req zone=per_ip burst=200 nodelay;
}
